name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Install MetaTrader5 (optional)
        continue-on-error: true
        run: pip install MetaTrader5

      - name: Build EXE
        shell: pwsh
        run: |
          $hi = ""
          python -c "import MetaTrader5" 2>$null
          if ($LASTEXITCODE -eq 0) { $hi = "--hidden-import=MetaTrader5" }
          pyinstaller --onefile --noconfirm --clean --name XAUUSD_World_Monitor $hi xauusd_mt5_book_bridge.py

      - name: Upload EXE (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD_World_Monitor
          path: dist/XAUUSD_World_Monitor.exe

      - name: Publish Release (only on version tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/XAUUSD_World_Monitor.exe
