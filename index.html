    html:`<div class="pulse" style="color:${colors[color]}"></div>`,
    iconSize:[24,24],
    iconAnchor:[12,12]
  });

  const m=L.marker([lat,lng],{icon}).addTo(map);

    direction:dir,

  });

}

function fmtEventDate(iso){
  return new Intl.DateTimeFormat("ja-JP",{
    timeZone:"Asia/Tokyo",
    month:"2-digit",
    day:"2-digit",
    weekday:"short",
    hour:"2-digit",
    minute:"2-digit",
    hour12:false
  }).format(new Date(iso));
}

function fmtCountdown(iso){
  const diff = new Date(iso) - new Date();
  if(diff <= 0) return "終了";

  const days = Math.floor(diff / 86400000);
  const hrs = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);

  if(days > 0) return `あと ${days}日 ${hrs}時間`;
  if(hrs > 0) return `あと ${hrs}時間 ${mins}分`;
  return `あと ${mins}分`;
}

      <div class="impactItem" onclick="showImpact(${i})">
        <span class="impactBadge">高</span>
        <span>${fmtEventDate(e.date)}　${e.title}</span>
        <span class="impactTime">${fmtCountdown(e.date)}</span>
      </div>
    `).join("");
}

      TradingView 経済カレンダーで確認

}

    const q="XAUUSD gold geopolitical risk Federal Reserve CPI";
    const url="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(
      "https://news.google.com/rss/search?q="+encodeURIComponent(q)+"&hl=ja&gl=JP&ceid=JP:ja"
    );

    const j=await (await fetch(url)).json();
    const items=(j.items||[]).slice(0,8).map((it,i)=>[
      i<2?"高":i<5?"中":"低",
      it.title.replace(/ - .*/,""),
      it.link
    ]);

    if(items.length){
      render("mena",items.slice(0,4));
      render("africa",items.slice(1,5));
      render("latam",items.slice(2,6));
      render("asia",items.slice(3,7));
      render("energy",items.slice(4,8));
      document.getElementById("ticker").textContent=items.map(x=>x[1]).join("　｜　");
    }
  }catch(e){
    document.getElementById("ticker").textContent=fallback.map(x=>x[1]).join("　｜　");
  }
}

loadNews();
setInterval(loadNews,60000);
</script>
</body>
</html>
