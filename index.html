<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD WAR ROOM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#050505;
  --panel:#0b0b0b;
  --panel2:#101010;
  --border:#202020;
  --text:#8a8a8a;
  --muted:#5f5f5f;
  --gold:#b89b5e;
  --green:#00ff88;
  --red:#ff2d2d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  padding:14px;
}

.wrap{
  max-width:1780px;
  margin:0 auto;
}

.panel{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
}

.top{
  display:grid;
  grid-template-columns:1fr 1.55fr 1.25fr;
  gap:14px;
  margin-bottom:14px;
}

.label{
  font-size:11px;
  color:var(--text);
  letter-spacing:1.3px;
  font-weight:800;
  margin-bottom:8px;
}

.tvBox{
  height:145px;
  overflow:hidden;
}

.clockCal{
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:18px;
}

.clock{
  font-size:42px;
  font-weight:900;
  color:var(--text);
}

.date{
  margin-top:8px;
  font-size:14px;
  color:var(--text);
}

.monthTitle{
  text-align:center;
  font-size:13px;
  font-weight:800;
  color:var(--text);
  margin-bottom:8px;
}

.calGrid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}

.calHead,
.calDay{
  text-align:center;
  font-size:11px;
  color:var(--text);
  padding:5px 0;
}

.calHead{
  color:var(--muted);
}

.today{
  background:rgba(255,45,45,.14);
  border:1px solid rgba(255,45,45,.35);
  border-radius:6px;
}

.todayTopList{
  height:130px;
  overflow:hidden;
}

.todayItem{
  border-bottom:1px solid #181818;
  padding:8px 0;
  font-size:12px;
}

.todayMain{
  display:grid;
  grid-template-columns:62px 1fr 78px;
  gap:8px;
  align-items:center;
}

.todayDate{
  color:var(--gold);
  font-weight:900;
}

.todayEvent{
  color:var(--text);
  font-weight:900;
}

.todayCount{
  color:var(--red);
  font-weight:900;
  text-align:right;
}

.todaySub{
  color:var(--muted);
  margin-top:5px;
  font-size:11px;
}

.main{
  display:grid;
  grid-template-columns:52% 48%;
  gap:14px;
  margin-bottom:14px;
}

.mapPanel{
  height:480px;
  position:relative;
  overflow:hidden;
}

.mapTitle{
  position:absolute;
  top:14px;
  left:16px;
  z-index:50;
  color:var(--text);
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
}

#map{
  position:absolute;
  left:14px;
  right:14px;
  top:48px;
  bottom:14px;
  border:1px solid #171717;
  border-radius:10px;
  overflow:hidden;
  background:#050505;
}

.leaflet-control-attribution,
.leaflet-control-zoom{
  display:none!important;
}

.sessionLabel{
  color:var(--text);
  background:rgba(5,5,5,.84);
  border:1px solid rgba(184,155,94,.28);
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  line-height:1.45;
  letter-spacing:.8px;
  text-align:center;
  min-width:96px;
}

.sessionLabel.open{
  border-color:rgba(255,45,45,.7);
}

.openText{
  color:var(--red);
  font-weight:900;
  animation:redPulse 1s infinite;
}

.blink24{
  animation:redPulse 1s infinite;
}

@keyframes redPulse{
  0%{opacity:1;text-shadow:0 0 5px var(--red);}
  50%{opacity:.25;text-shadow:0 0 20px var(--red);}
  100%{opacity:1;text-shadow:0 0 5px var(--red);}
}

.newsPanel{
  height:480px;
  overflow:hidden;
}

.newsHead,
.newsRow{
  display:grid;
  grid-template-columns:68px 52px 1fr 62px 64px 64px 88px;
  gap:8px;
  align-items:center;
}

.newsHead{
  padding:10px 0;
  border-bottom:1px solid #1b1b1b;
  font-size:11px;
  color:var(--muted);
}

.newsRow{
  padding:9px 0;
  border-bottom:1px solid #181818;
  font-size:12px;
}

.eventCell{
  font-weight:800;
  color:var(--text);
}

.impactCell{
  color:var(--red);
  font-weight:900;
}

.countCell{
  color:var(--gold);
  font-weight:900;
}

.redCount{
  color:var(--red)!important;
}

.intel{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:10px;
  margin-bottom:14px;
}

.intelCard{
  height:96px;
}

.intelTitle{
  color:var(--text);
  font-size:12px;
  font-weight:900;
  margin-bottom:16px;
}

.intelStatus{
  color:var(--gold);
  font-size:18px;
  font-weight:900;
}

.banner{
  height:58px;
  overflow:hidden;
  position:relative;
  color:var(--text);
}

.bannerInner{
  position:absolute;
  top:18px;
  white-space:nowrap;
  animation:ticker 55s linear infinite;
  color:var(--text);
  font-size:13px;
  letter-spacing:1.1px;
}

.bannerInner span{
  margin-right:46px;
}

.liveSource{
  color:var(--gold);
  font-weight:900;
}

.liveTime{
  color:var(--muted);
  font-weight:900;
}

.liveRed{
  color:var(--red);
  font-weight:900;
}

.liveGreen{
  color:var(--green);
  font-weight:900;
}

@keyframes ticker{
  from{transform:translateX(100%);}
  to{transform:translateX(-100%);}
}
</style>
</head>

<body>
<div class="wrap">

  <div class="top">

    <div class="panel">
      <div class="label">XAUUSD</div>
      <div class="tvBox">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
          {
            "symbol": "OANDA:XAUUSD",
            "width": "100%",
            "isTransparent": true,
            "colorTheme": "dark",
            "locale": "ja"
          }
          </script>
        </div>
      </div>
    </div>

    <div class="panel clockCal">
      <div>
        <div class="label">JST CLOCK</div>
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="dateText">----</div>
      </div>

      <div>
        <div class="monthTitle" id="monthTitle">----</div>
        <div class="calGrid" id="calendarGrid"></div>
      </div>
    </div>

    <div class="panel">
      <div class="label">TODAY HIGH IMPACT</div>
      <div class="todayTopList" id="todayImpactTop"></div>
    </div>

  </div>

  <div class="main">

    <div class="panel mapPanel">
      <div class="mapTitle">WORLD MONITOR</div>
      <div id="map"></div>
    </div>

    <div class="panel newsPanel">
      <div class="label">HIGH IMPACT NEWS</div>

      <div class="newsHead">
        <div>DATE</div>
        <div>TIME</div>
        <div>EVENT</div>
        <div>IMPACT</div>
        <div>予想</div>
        <div>前回</div>
        <div>COUNT</div>
      </div>

      <div id="highImpactList"></div>
    </div>

  </div>

  <div class="intel">
    <div class="panel intelCard"><div class="intelTitle">MIDDLE EAST</div><div class="intelStatus">WATCH</div></div>
    <div class="panel intelCard"><div class="intelTitle">RED SEA</div><div class="intelStatus">WATCH</div></div>
    <div class="panel intelCard"><div class="intelTitle">UKRAINE</div><div class="intelStatus">WATCH</div></div>
    <div class="panel intelCard"><div class="intelTitle">TAIWAN</div><div class="intelStatus">WATCH</div></div>
    <div class="panel intelCard"><div class="intelTitle">FED</div><div class="intelStatus">WATCH</div></div>
    <div class="panel intelCard"><div class="intelTitle">CENTRAL BANK</div><div class="intelStatus">WATCH</div></div>
    <div class="panel intelCard"><div class="intelTitle">ENERGY</div><div class="intelStatus">WATCH</div></div>
    <div class="panel intelCard"><div class="intelTitle">SANCTIONS</div><div class="intelStatus">WATCH</div></div>
  </div>

  <div class="panel banner">
    <div class="bannerInner" id="liveTicker"></div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================
   HIGH IMPACT EVENTS
   events.json があれば自動読込
   無ければ下の初期データを表示
========================= */

const highImpactEvents = [
  {date:"2026-06-01",time:"21:30",currency:"USD",event:"CPI m/m",impact:"HIGH",forecast:"0.3%",previous:"0.2%"},
  {date:"2026-06-01",time:"21:30",currency:"USD",event:"CPI y/y",impact:"HIGH",forecast:"2.4%",previous:"2.6%"},
  {date:"2026-06-01",time:"23:00",currency:"USD",event:"ISM Manufacturing PMI",impact:"HIGH",forecast:"49.8",previous:"48.7"},
  {date:"2026-06-01",time:"23:00",currency:"USD",event:"JOLTS Job Openings",impact:"HIGH",forecast:"7.45M",previous:"7.19M"},

  {date:"2026-06-03",time:"21:15",currency:"USD",event:"ADP Employment Change",impact:"HIGH",forecast:"115K",previous:"102K"},
  {date:"2026-06-05",time:"21:30",currency:"USD",event:"Non-Farm Payrolls",impact:"HIGH",forecast:"138K",previous:"177K"},
  {date:"2026-06-11",time:"21:30",currency:"USD",event:"CPI m/m",impact:"HIGH",forecast:"0.2%",previous:"0.3%"},
  {date:"2026-06-12",time:"21:30",currency:"USD",event:"PPI m/m",impact:"HIGH",forecast:"0.2%",previous:"-0.1%"},
  {date:"2026-06-18",time:"03:00",currency:"USD",event:"FOMC Rate Decision",impact:"HIGH",forecast:"4.50%",previous:"4.50%"}
];

async function loadHighImpactEvents(){
  try{
    const res = await fetch("./events.json?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("events.json not found");
    const data = await res.json();

    if(Array.isArray(data)){
      highImpactEvents.length = 0;
      data.forEach(e => highImpactEvents.push(e));
    }
  }catch(e){
    // events.json が無い場合は初期データを使う
  }

  renderHighImpact();
}

/* =========================
   EVENT TIME
========================= */

function getEventDate(e){
  const [y,m,d] = e.date.split("-").map(Number);
  const [hh,mm] = e.time.split(":").map(Number);
  return new Date(y,m-1,d,hh,mm,0,0);
}

function countdown(target){
  const diff = target - new Date();

  if(diff < -3600000) return null;
  if(diff < 0) return "ENDED";

  const t = Math.floor(diff / 1000);
  const d = Math.floor(t / 86400);
  const h = Math.floor((t % 86400) / 3600);
  const m = Math.floor((t % 3600) / 60);
  const s = t % 60;

  if(d > 0){
    return `${d}D ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function isWithin24h(target){
  const diff = target - new Date();
  return diff > 0 && diff <= 86400000;
}

/* =========================
   RENDER HIGH IMPACT
========================= */

function renderHighImpact(){
  const list = document.getElementById("highImpactList");
  const todayBox = document.getElementById("todayImpactTop");

  list.innerHTML = "";
  todayBox.innerHTML = "";

  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  const nextMonthLimit = new Date(now.getFullYear(), now.getMonth()+2, 0, 23, 59, 59);

  const sorted = [...highImpactEvents]
    .map(e => ({...e, target:getEventDate(e)}))
    .filter(e => e.target <= nextMonthLimit)
    .sort((a,b) => a.target - b.target);

  sorted.forEach(e=>{
    const cd = countdown(e.target);
    if(cd === null) return;

    const blink = isWithin24h(e.target) ? "blink24" : "";

    const row = document.createElement("div");
    row.className = `newsRow ${blink}`;
    row.innerHTML = `
      <div>${e.date.slice(5)}</div>
      <div>${e.time}</div>
      <div class="eventCell">${e.currency} ${e.event}</div>
      <div class="impactCell">${e.impact}</div>
      <div>${e.forecast}</div>
      <div>${e.previous}</div>
      <div class="countCell ${blink ? "redCount" : ""}">${cd}</div>
    `;
    list.appendChild(row);

    if(e.date === today){
      const item = document.createElement("div");
      item.className = `todayItem ${blink}`;
      item.innerHTML = `
        <div class="todayMain">
          <div class="todayDate">${e.date.slice(5)}<br>${e.time}</div>
          <div class="todayEvent">${e.currency} ${e.event}</div>
          <div class="todayCount">${cd}</div>
        </div>
        <div class="todaySub">予想 ${e.forecast} / 前回 ${e.previous}</div>
      `;
      todayBox.appendChild(item);
    }
  });

  if(todayBox.innerHTML.trim() === ""){
    todayBox.innerHTML = `<div class="todayItem">本日のHIGH IMPACTなし</div>`;
  }
}

/* =========================
   CLOCK + CALENDAR
========================= */

let lastCalendarKey = "";

function updateClock(){
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("ja-JP",{hour12:false});

  document.getElementById("dateText").textContent =
    now.toLocaleDateString("ja-JP",{
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      weekday:"short"
    });

  updateSession(now.getHours());
  autoCalendarUpdate();
}

function autoCalendarUpdate(){
  const now = new Date();
  const key = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;

  if(key !== lastCalendarKey){
    lastCalendarKey = key;
    renderCalendar();
  }
}

function renderCalendar(){
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const grid = document.getElementById("calendarGrid");

  document.getElementById("monthTitle").textContent =
    `${y} / ${String(m+1).padStart(2,"0")}`;

  grid.innerHTML = "";

  ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(h=>{
    grid.innerHTML += `<div class="calHead">${h}</div>`;
  });

  const first = new Date(y,m,1);
  const last = new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++){
    grid.innerHTML += `<div class="calDay"></div>`;
  }

  for(let d=1;d<=last.getDate();d++){
    grid.innerHTML += `<div class="calDay ${d===now.getDate() ? "today" : ""}">${d}</div>`;
  }
}

/* =========================
   MAP + SESSION
========================= */

let sessionMarkers = {};

function sessionHtml(name,time,isOpen){
  return `
    <div class="sessionLabel ${isOpen ? "open" : ""}">
      ${name}<br>${time}<br>
      ${isOpen ? `<span class="openText">● OPEN</span>` : ``}
    </div>
  `;
}

function updateSession(hour){
  const asiaOpen = hour >= 7 && hour < 15;
  const londonOpen = hour >= 15 && hour < 21;
  const usOpen = hour >= 21 || hour < 6;

  if(sessionMarkers.asia){
    sessionMarkers.asia.setIcon(L.divIcon({
      className:"",
      html:sessionHtml("ASIA","07:00-15:00",asiaOpen),
      iconSize:[110,70]
    }));

    sessionMarkers.london.setIcon(L.divIcon({
      className:"",
      html:sessionHtml("LONDON","15:00-21:00",londonOpen),
      iconSize:[120,70]
    }));

    sessionMarkers.us.setIcon(L.divIcon({
      className:"",
      html:sessionHtml("US","21:00-06:00",usOpen),
      iconSize:[110,70]
    }));
  }
}

function initMap(){
  const map = L.map("map",{
    zoomControl:false,
    attributionControl:false,
    dragging:false,
    scrollWheelZoom:false,
    doubleClickZoom:false,
    boxZoom:false,
    keyboard:false,
    tap:false
  }).setView([20,10],2);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
    maxZoom:5,
    minZoom:2
  }).addTo(map);

  sessionMarkers.us = L.marker([39,-98],{
    icon:L.divIcon({className:"",html:sessionHtml("US","21:00-06:00",false),iconSize:[110,70]})
  }).addTo(map);

  sessionMarkers.london = L.marker([51,-1],{
    icon:L.divIcon({className:"",html:sessionHtml("LONDON","15:00-21:00",false),iconSize:[120,70]})
  }).addTo(map);

  sessionMarkers.asia = L.marker([35,120],{
    icon:L.divIcon({className:"",html:sessionHtml("ASIA","07:00-15:00",false),iconSize:[110,70]})
  }).addTo(map);

  setTimeout(()=>map.invalidateSize(),300);
}

/* =========================
   LIVE TICKER
========================= */

const liveFeedLines = [
  {source:"REUTERS", text:"Gold remains sensitive to geopolitical headlines and US economic data."},
  {source:"BLOOMBERG", text:"Traders monitor dollar moves ahead of high impact US releases."},
  {source:"FOREXLIVE", text:"XAUUSD volatility expected around CPI, NFP, ISM and FOMC events."},
  {source:"MARKET", text:"Safe-haven demand remains active while risk sentiment stays fragile."},
  {source:"NEWS", text:"Energy, sanctions and Middle East headlines remain key gold drivers."},
  {source:"ANALYST", text:"Gold desk watching liquidity around London and US session overlap."}
];

function renderLiveTicker(){
  const now = new Date().toLocaleTimeString("ja-JP",{hour12:false});

  const nextEvents = [...highImpactEvents]
    .map(e=>({...e,target:getEventDate(e)}))
    .filter(e=>e.target-new Date()>0)
    .sort((a,b)=>a.target-b.target)
    .slice(0,3)
    .map(e=>`<span><b class="liveRed">${e.event}</b> ${countdown(e.target)}</span>`)
    .join("");

  const live = liveFeedLines.map(item=>{
    return `
      <span>
        <b class="liveTime">${now}</b>
        <b class="liveSource">${item.source}</b>
        ${item.text}
      </span>
    `;
  }).join("");

  document.getElementById("liveTicker").innerHTML = `
    <span>XAUUSD WAR ROOM</span>
    ${nextEvents}
    ${live}
    <span class="liveRed">HIGH IMPACT NEWS AUTO UPDATE</span>
    <span>XAUUSD WAR ROOM</span>
  `;
}

/* =========================
   INIT
========================= */

initMap();
renderCalendar();
updateClock();
loadHighImpactEvents();
renderLiveTicker();

setInterval(updateClock,1000);
setInterval(renderHighImpact,1000);
setInterval(loadHighImpactEvents,30000);
setInterval(renderLiveTicker,10000);
</script>

</body>
</html>
