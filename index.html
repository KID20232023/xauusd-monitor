<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>XAUUSD PRO MONITOR</title>

<style>

body{
background:#050505;
color:white;
font-family:Arial;
margin:0;
padding:20px;
}

h1{
text-align:center;
color:#d4af37;
}

.box{
border:1px solid #d4af37;
border-radius:15px;
padding:20px;
margin-bottom:20px;
background:#111;
}

.time{
font-size:30px;
color:#00ff88;
text-align:center;
}

</style>

</head>

<body>

<h1>XAUUSD PRO MONITOR</h1>

<div class="box">
<h2>東京</h2>
<div id="tokyo" class="time"></div>
</div>

<div class="box">
<h2>ロンドン</h2>
<div id="london" class="time"></div>
</div>

<div class="box">
<h2>ニューヨーク</h2>
<div id="ny" class="time"></div>
</div>

<script>

function updateTime(){

const now=new Date();

document.getElementById("tokyo").innerHTML=
now.toLocaleTimeString("ja-JP",{timeZone:"Asia/Tokyo"});

document.getElementById("london").innerHTML=
now.toLocaleTimeString("en-GB",{timeZone:"Europe/London"});

document.getElementById("ny").innerHTML=
now.toLocaleTimeString("en-US",{timeZone:"America/New_York"});

}

setInterval(updateTime,1000);
updateTime();

</script>

</body>
</html>
