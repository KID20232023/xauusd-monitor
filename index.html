<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD WAR ROOM</title>

<style>
:root{
  --bg:#050505;
  --panel:#0b0b0b;
  --panel2:#080808;
  --border:#171717;
  --text:#8a8a8a;
  --gold:#b89b5e;
  --green:#00ff88;
  --red:#ff2d2d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  padding:18px;
}

.wrap{
  width:100%;
  max-width:1700px;
  margin:0 auto;
}

.panel{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}

.top{
  display:grid;
  grid-template-columns:1.1fr 1fr 1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}

.name{
  color:var(--gold);
  font-size:24px;
  letter-spacing:2px;
  font-weight:700;
}

.label{
  color:var(--text);
  font-size:12px;
  letter-spacing:1.5px;
  margin-bottom:8px;
}

.num{
  color:var(--green);
  font-size:32px;
  font-weight:700;
}

.small-num{
  color:var(--green);
  font-size:18px;
  font-weight:700;
}

.clock{
  font-size:32px;
  color:var(--text);
  font-weight:700;
}

.date{
  color:var(--text);
  font-size:15px;
}

.main{
  display:grid;
  grid-template-columns:42% 58%;
  gap:14px;
  margin-bottom:14px;
}

.mapBox{
  height:390px;
  position:relative;
  overflow:hidden;
}

.mapBox iframe{
  width:100%;
  height:100%;
  border:0;
  filter:grayscale(25%) brightness(.7) contrast(1.1);
}

.session{
  position:absolute;
  color:var(--text);
  font-size:12px;
  letter-spacing:1px;
  line-height:1.45;
  background:rgba(5,5,5,.72);
  border:1px solid rgba(184,155,94,.22);
  padding:8px 10px;
  border-radius:8px;
}

.asia{ left:67%; top:44%; }
.london{ left:45%; top:31%; }
.us{ left:24%; top:36%; }

.open-dot{
  display:none;
  color:var(--red);
  font-weight:700;
  animation:blink 1s infinite;
}

.session.open .open-dot{
  display:inline;
}

.session.open{
  border-color:rgba(255,45,45,.65);
}

@keyframes blink{
  0%{opacity:1;text-shadow:0 0 4px var(--red);}
  50%{opacity:.25;text-shadow:0 0 18px var(--red);}
  100%{opacity:1;text-shadow:0 0 4px var(--red);}
}

.rightGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.events{
  height:390px;
  overflow:hidden;
}

.event{
  display:grid;
  grid-template-columns:70px 1fr 80px;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid #161616;
  font-size:13px;
}

.event .time{
  color:var(--green);
  font-weight:700;
}

.event .impact{
  color:var(--red);
  text-align:right;
  font-weight:700;
}

.calendarBox{
  height:390px;
}

.calendarDate{
  font-size:40px;
  color:var(--green);
  font-weight:700;
  margin-top:22px;
}

.calendarMonth{
  font-size:16px;
  color:var(--text);
  margin-top:8px;
}

.bottom{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:14px;
}

.intel{
  min-height:105px;
}

.intelTitle{
  color:var(--text);
  font-size:13px;
  letter-spacing:1.5px;
  margin-bottom:14px;
}

.status{
  color:var(--gold);
  font-size:20px;
  font-weight:700;
}

.feed{
  height:58px;
  overflow:hidden;
  white-space:nowrap;
  position:relative;
}

.feedInner{
  position:absolute;
  white-space:nowrap;
  animation:ticker 32s linear infinite;
  color:var(--text);
  font-size:14px;
  letter-spacing:1px;
}

.feedInner span{
  margin-right:48px;
}

@keyframes ticker{
  from{transform:translateX(100%);}
  to{transform:translateX(-100%);}
}

@media(max-width:1000px){
  .top,.main,.rightGrid,.bottom{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="panel">
      <div class="name">XAUUSD WAR ROOM</div>
    </div>

    <div class="panel">
      <div class="label">XAUUSD</div>
      <div class="num" id="xauPrice">----</div>
      <div class="small-num" id="xauChange">----</div>
    </div>

    <div class="panel">
      <div class="label">CALENDAR</div>
      <div class="date" id="calendarText">----</div>
    </div>

    <div class="panel">
      <div class="label">DIGITAL CLOCK</div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
  </div>

  <div class="main">

    <div class="panel mapBox">
      <iframe src="https://www.worldmonitor.app/?lat=-22.9997&lon=12.8906&zoom=1.00&view=global&timeRange=7d&layers=conflicts%2Cbases%2Chotspots%2Cnuclear%2Csanctions%2Cweather%2Ceconomic%2Cwaterways%2Coutages%2Cmilitary%2Cnatural%2CiranAttacks"></iframe>

      <div class="session asia" id="asiaSession">
        ASIA<br>07:00-15:00<br><span class="open-dot">● OPEN</span>
      </div>

      <div class="session london" id="londonSession">
        LONDON<br>15:00-21:00<br><span class="open-dot">● OPEN</span>
      </div>

      <div class="session us" id="usSession">
        US<br>21:00-06:00<br><span class="open-dot">● OPEN</span>
      </div>
    </div>

    <div class="rightGrid">

      <div class="panel events">
        <div class="label">HIGH IMPACT EVENTS</div>
        <div id="eventsList"></div>
      </div>

      <div class="panel calendarBox">
        <div class="label">CALENDAR</div>
        <div class="calendarDate" id="dayNum">--</div>
        <div class="calendarMonth" id="monthText">----</div>
      </div>

    </div>
  </div>

  <div class="bottom">
    <div class="panel intel"><div class="intelTitle">MIDDLE EAST</div><div class="status">WATCH</div></div>
    <div class="panel intel"><div class="intelTitle">RED SEA</div><div class="status">WATCH</div></div>
    <div class="panel intel"><div class="intelTitle">UKRAINE</div><div class="status">WATCH</div></div>
    <div class="panel intel"><div class="intelTitle">TAIWAN</div><div class="status">WATCH</div></div>
    <div class="panel intel"><div class="intelTitle">FED</div><div class="status">WATCH</div></div>
    <div class="panel intel"><div class="intelTitle">CENTRAL BANK</div><div class="status">WATCH</div></div>
    <div class="panel intel"><div class="intelTitle">ENERGY</div><div class="status">WATCH</div></div>
    <div class="panel intel"><div class="intelTitle">SANCTIONS</div><div class="status">WATCH</div></div>
  </div>

  <div class="panel feed">
    <div class="feedInner" id="feedText"></div>
  </div>

</div>

<script>
const xauusd = {
  price:"3382.45",
  change:"+18.72"
};

const highImpactEvents = [
  {time:"23:00", title:"ISM MANUFACTURING", impact:"HIGH"},
  {time:"23:00", title:"JOLTS", impact:"HIGH"},
  {time:"21:15", title:"ADP", impact:"HIGH"},
  {time:"21:30", title:"NFP", impact:"HIGH"},
  {time:"21:30", title:"CPI", impact:"HIGH"},
  {time:"21:30", title:"PPI", impact:"HIGH"},
  {time:"03:00", title:"FOMC", impact:"HIGH"}
];

const liveFeed = [
  "REUTERS",
  "BLOOMBERG",
  "FOREXLIVE",
  "HIGH IMPACT EVENTS",
  "XAUUSD MARKET WATCH",
  "WORLD MONITOR"
];

function setXauusd(){
  document.getElementById("xauPrice").textContent = xauusd.price;
  document.getElementById("xauChange").textContent = xauusd.change;
}

function updateClock(){
  const now = new Date();

  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  document.getElementById("clock").textContent = `${h}:${m}:${s}`;

  document.getElementById("calendarText").textContent =
    now.toLocaleDateString("ja-JP",{
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      weekday:"short"
    });

  document.getElementById("dayNum").textContent = now.getDate();

  document.getElementById("monthText").textContent =
    now.toLocaleDateString("ja-JP",{
      year:"numeric",
      month:"long",
      weekday:"long"
    });

  updateSession(now.getHours());
}

function updateSession(hour){
  const asia = document.getElementById("asiaSession");
  const london = document.getElementById("londonSession");
  const us = document.getElementById("usSession");

  asia.classList.remove("open");
  london.classList.remove("open");
  us.classList.remove("open");

  if(hour >= 7 && hour < 15){
    asia.classList.add("open");
  }else if(hour >= 15 && hour < 21){
    london.classList.add("open");
  }else{
    us.classList.add("open");
  }
}

function renderEvents(){
  const box = document.getElementById("eventsList");
  box.innerHTML = "";

  highImpactEvents.forEach(e=>{
    const div = document.createElement("div");
    div.className = "event";
    div.innerHTML = `
      <div class="time">${e.time}</div>
      <div>${e.title}</div>
      <div class="impact">${e.impact}</div>
    `;
    box.appendChild(div);
  });
}

function renderFeed(){
  document.getElementById("feedText").innerHTML =
    liveFeed.map(t=>`<span>${t}</span>`).join("");
}

setXauusd();
renderEvents();
renderFeed();
updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
