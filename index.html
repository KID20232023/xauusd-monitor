<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XAUUSD WAR ROOM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;color:#e8edf2;font-family:Arial,"Meiryo",sans-serif}
:root{--red:#ff3030;--orange:#ff8c1a;--yellow:#ffd54f;--blue:#2f8cff;--purple:#9b4dff;--green:#00e676}
.app{height:100vh;display:grid;grid-template-rows:34px 1fr 215px 28px;gap:2px;background:#050505}
.topbar{background:#0b0b0b;border-bottom:1px solid #202020;display:flex;align-items:center;gap:16px;padding:0 10px;font-size:13px}
.brand{color:#00d0aa;font-weight:900;font-size:17px}
.live{color:var(--green);font-weight:900}
.centerTitle{margin:auto;background:#111;border:1px solid #8a5d17;color:#f2b84b;border-radius:5px;padding:5px 70px;font-weight:900}
#topJstTime{font-weight:900}

.main{display:grid;grid-template-columns:155px 1fr;gap:2px;min-height:0}
.sidebar{background:#0c0c0c;border-right:1px solid #222;padding:7px;overflow:hidden}
.sideTitle{font-size:12px;font-weight:900;margin-bottom:6px}
.check{display:flex;align-items:center;gap:6px;border-bottom:1px solid #202020;padding:6px 0;font-size:11px}
.check input{accent-color:#00c878}

.mapArea{display:grid;grid-template-rows:1fr 205px;gap:2px;min-height:0}
.mapWrap{position:relative;background:#050505;border:1px solid #202020;overflow:hidden}
#map{width:100%;height:100%;background:#050505}
.leaflet-container{background:#050505!important}
.leaflet-tile-pane{filter:brightness(1.25) contrast(1.12) saturate(.9)}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom a{background:#0b0b0b!important;color:#fff!important;border-bottom:1px solid #333!important}

.mapTop{position:absolute;top:10px;left:12px;z-index:500;background:#080808d9;border:1px solid #222;border-radius:4px;padding:6px 10px;font-size:12px}
.legend{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:500;background:#090909e6;border:1px solid #222;border-radius:4px;padding:7px 14px;font-size:11px}

.pulse{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor,0 0 22px currentColor,0 0 45px currentColor;position:relative}
.pulse:after{content:"";position:absolute;inset:-12px;border:1px solid currentColor;border-radius:50%;animation:ripple 1.6s infinite}
@keyframes ripple{from{transform:scale(.35);opacity:1}to{transform:scale(1.7);opacity:0}}

.sessionPulse{width:13px;height:13px;border-radius:50%;background:#00e676;box-shadow:0 0 15px #00e676,0 0 40px #00e676;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.sessionLabel{background:rgba(0,20,10,.92)!important;color:#00ff88!important;border:1px solid #00ff88!important;border-radius:6px!important;font-size:12px!important;font-weight:900!important;padding:7px 10px!important;box-shadow:0 0 18px rgba(0,255,136,.55)!important}

.marketLabel{background:#0b0b0be6!important;border:1px solid #333!important;color:#fff!important;font-size:11px!important;font-weight:900!important;padding:4px 8px!important;border-radius:4px!important;box-shadow:0 0 12px rgba(0,0,0,.8)!important}
.leaflet-tooltip:before{display:none!important}

.footerPanels{display:grid;grid-template-columns:1.35fr 1.05fr;gap:2px}
.panel{background:#0d0d0d;border:1px solid #222;padding:8px;overflow:hidden}
.panelTitle{font-size:12px;font-weight:900;margin-bottom:6px}
.impactBox,.guideBox{height:155px;overflow-y:auto;font-size:12px;padding-right:4px}
.impactItem{display:grid;grid-template-columns:36px 1fr 80px;gap:8px;border-bottom:1px solid #242424;padding:7px 0;align-items:center;cursor:pointer}
.impactItem:hover,.item:hover{background:#101820}
.impactBadge{background:#4b1010;color:#ff4d4d;font-weight:900;text-align:center;border-radius:3px;padding:2px 0}
.impactTime{color:#aaa;text-align:right;font-size:11px}
.guideBox button{width:100%;background:none;border:0;color:#e8edf2;text-align:left;border-bottom:1px solid #242424;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:12px;padding:4px 0}
.guideBox button:hover{color:#00e676}

.bottom{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px}
.youtubePanel{background:#0d0d0d;border:1px solid #222;overflow:hidden}
.youtubeTitle{height:28px;display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:900;border-bottom:1px solid #222}
.youtubeBox{height:187px;background:#000;position:relative}
.youtubeBox iframe{width:100%;height:100%;border:0;background:#000}
.youtubeLink{position:absolute;right:8px;bottom:8px;background:#b00000;color:#fff;font-size:11px;font-weight:900;padding:5px 8px;border-radius:4px;text-decoration:none}

.item{display:block;border-bottom:1px solid #242424;padding:6px 0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.badge{display:inline-block;padding:1px 5px;border-radius:2px;margin-right:5px;font-weight:900}
.h{background:#4b1010;color:#ff4d4d}.m{background:#3d2706;color:#ffb13b}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;box-shadow:0 0 10px currentColor}
.dot.green{background:#00e676;color:#00e676}.dot.red{background:#ff3030;color:#ff3030}.dot.orange{background:#ff8c1a;color:#ff8c1a}.dot.blue{background:#2f8cff;color:#2f8cff}.dot.purple{background:#9b4dff;color:#9b4dff}.dot.yellow{background:#ffd54f;color:#ffd54f}

.break{display:flex;align-items:center;overflow:hidden;background:#0a0a0a;border-top:1px solid #222}
.break b{background:#b00000;color:#fff;padding:8px 18px;font-size:12px}
.ticker{white-space:nowrap;animation:flow 220s linear infinite;font-size:12px;padding-left:20px}
@keyframes flow{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:99999}
.modal.show{display:flex}
.modalCard{width:min(650px,90vw);background:#080f18;border:1px solid #00e676;border-radius:10px;padding:20px}
.modalTitle{font-size:24px;font-weight:900;margin-bottom:12px;color:#00e676}
.modalText{font-size:15px;line-height:1.8}
.modalClose{margin-top:16px;background:#101820;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer}
.hiddenPanel{display:none!important}
</style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand">🌐 ワールド</div>
    <b>モニター</b>
    <span>v2.1.4</span>
    <span class="live">● ライブ</span>
    <span>グローバル</span>
    <span id="topJstTime">----</span>
    <div class="centerTitle">XAUUSD WAR ROOM</div>
    <span class="live">● 自動更新</span>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sideTitle">世界情報</div>
      <label class="check"><input id="intelToggle" type="checkbox" checked onchange="toggleIntelligence(this.checked)"> インテリジェントスポット</label>
      <label class="check"><input id="conflictToggle" type="checkbox" checked onchange="toggleLayer('conflict',this.checked)"> 紛争地域</label>
      <label class="check"><input id="economicToggle" type="checkbox" checked onchange="toggleLayer('economic',this.checked)"> 重要指標</label>
      <label class="check"><input id="oilToggle" type="checkbox" checked onchange="toggleLayer('oilrate',this.checked)"> 原油・金利</label>
      <label class="check"><input type="checkbox"> 供給網</label>
      <label class="check"><input type="checkbox"> AIデータセンター</label>
      <label class="check"><input type="checkbox" checked> 事件速報</label>
      <label class="check"><input type="checkbox"> 貿易政策</label>
      <label class="check"><input type="checkbox"> 核関連</label>
    </div>

    <div class="mapArea">
      <div class="mapWrap">
        <div id="map"></div>
        <div class="mapTop">GLOBAL VIEW</div>
        <div class="legend">
          <span style="color:#00e676">● セッション</span>　
          <span style="color:#ff3030">● 地政学</span>　
          <span style="color:#ffd54f">● 経済</span>　
          <span style="color:#2f8cff">● 中央銀行</span>　
          <span style="color:#9b4dff">● 市場</span>
        </div>
      </div>

      <div class="footerPanels">
        <div class="panel">
          <div class="panelTitle">HIGH IMPACT NEWS</div>
          <div id="highImpactJP" class="impactBox"></div>
        </div>

        <div class="panel" id="guidePanel">
          <div class="panelTitle">FLASHPOINT GUIDE</div>
          <div class="guideBox" id="guideBox"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="youtubePanel">
      <div class="youtubeTitle">BLOOMBERG LIVE</div>
      <div class="youtubeBox">
        <iframe src="https://www.youtube.com/embed/gCNeDWCI0vo" allowfullscreen></iframe>
        <a class="youtubeLink" target="_blank" href="https://www.youtube.com/results?search_query=Bloomberg+TV+Live">OPEN</a>
      </div>
    </div>

    <div class="youtubePanel">
      <div class="youtubeTitle">KITCO GOLD LIVE</div>
      <div class="youtubeBox">
        <iframe src="https://www.youtube.com/embed/9Auq9mYxFEE" allowfullscreen></iframe>
        <a class="youtubeLink" target="_blank" href="https://www.youtube.com/results?search_query=Kitco+Gold+Live">OPEN</a>
      </div>
    </div>

    <div class="youtubePanel">
      <div class="youtubeTitle">CNBC LIVE</div>
      <div class="youtubeBox">
        <iframe src="https://www.youtube.com/embed/9NyxcX3rhQs" allowfullscreen></iframe>
        <a class="youtubeLink" target="_blank" href="https://www.youtube.com/results?search_query=CNBC+Live">OPEN</a>
      </div>
    </div>

    <div class="youtubePanel">
      <div class="youtubeTitle">XAUUSD / GOLD NEWS</div>
      <div class="youtubeBox">
        <iframe src="https://www.youtube.com/embed/lNYcviXK4rg" allowfullscreen></iframe>
        <a class="youtubeLink" target="_blank" href="https://www.youtube.com/results?search_query=XAUUSD+Gold+News+Live">OPEN</a>
      </div>
    </div>
  </div>

  <div class="break">
    <b>BREAKING NEWS</b>
    <div id="ticker" class="ticker">リアルタイムニュース取得中...</div>
  </div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
  <div id="modalCard" class="modalCard" onclick="event.stopPropagation()">
    <div id="modalTitle" class="modalTitle"></div>
    <div id="modalText" class="modalText"></div>
    <button class="modalClose" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
function clock(){
  const now=new Date();
  const jst=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(now);
  const date=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"}).format(now);
  document.getElementById("topJstTime").textContent=date+" "+jst+" JST";
}
setInterval(clock,1000);
clock();

const map=L.map("map",{
  zoomControl:true,
  attributionControl:false,
  minZoom:2,
  maxZoom:6,
  zoomSnap:.25,
  worldCopyJump:false,
  maxBounds:[[-85,-180],[85,180]]
}).setView([23,25],2.35);

L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
  subdomains:"abcd",
  maxZoom:19
}).addTo(map);

const layers={
  intelligence:L.layerGroup().addTo(map),
  conflict:L.layerGroup().addTo(map),
  economic:L.layerGroup().addTo(map),
  oilrate:L.layerGroup().addTo(map),
  session:L.layerGroup().addTo(map)
};

const colors={red:"#ff3030",orange:"#ff8c1a",yellow:"#ffd54f",blue:"#2f8cff",purple:"#9b4dff"};

function add(layerName,lat,lng,color,title,body,dir="top",offset=[0,-14]){
  const icon=L.divIcon({
    className:"",
    html:`<div class="pulse" style="color:${colors[color]}"></div>`,
    iconSize:[20,20],
    iconAnchor:[10,10]
  });

  const m=L.marker([lat,lng],{icon}).addTo(layers[layerName]);

  m.bindTooltip(`<b>${title}</b>`,{
    permanent:true,
    direction:dir,
    offset,
    className:"marketLabel"
  });

  m.on("click",()=>openYoutube(title+" XAUUSD gold news"));
}

function addSession(lat,lng,title,open,close,dir="top",offset=[0,-10]){
  const icon=L.divIcon({className:"",html:`<div class="sessionPulse"></div>`,iconSize:[24,24],iconAnchor:[12,12]});
  const m=L.marker([lat,lng],{icon}).addTo(layers.session);
  m.bindTooltip(`<b>${title}</b><br>OPEN ${open} JST<br>CLOSE ${close} JST`,{permanent:true,direction:dir,offset,className:"sessionLabel"});
}

function toggleLayer(name,state){state?map.addLayer(layers[name]):map.removeLayer(layers[name])}

function toggleIntelligence(state){
  const guidePanel=document.getElementById("guidePanel");
  if(state){
    ["intelligence","session","conflict","economic","oilrate"].forEach(x=>map.addLayer(layers[x]));
    ["conflictToggle","economicToggle","oilToggle"].forEach(id=>document.getElementById(id).checked=true);
    guidePanel.classList.remove("hiddenPanel");
  }else{
    ["intelligence","session","conflict","economic","oilrate"].forEach(x=>map.removeLayer(layers[x]));
    ["conflictToggle","economicToggle","oilToggle"].forEach(id=>document.getElementById(id).checked=false);
    guidePanel.classList.add("hiddenPanel");
  }
}

add("intelligence",40.7,-74,"purple","NY","米国市場","bottom",[0,14]);
add("intelligence",51.5,-0.1,"blue","LONDON","欧州市場","top",[0,-14]);
add("intelligence",35.7,139.7,"purple","TOKYO","アジア市場","left",[-14,0]);
add("intelligence",22.3,114.1,"blue","HONG KONG","中国資金フロー","right",[14,0]);
add("intelligence",25.2,55.3,"orange","DUBAI","中東資金","bottom",[0,14]);
add("intelligence",39.9,116.4,"yellow","BEIJING","中国経済","left",[-14,0]);

add("economic",39,-77,"blue","FRB","米金融政策","right",[14,0]);
add("economic",50.1,8.6,"blue","ECB","欧州金融政策","right",[14,0]);
add("economic",35.6,139.7,"blue","BOJ","日銀","right",[14,0]);
add("economic",39.9,116.4,"yellow","PBOC","中国人民銀行","right",[14,0]);

add("conflict",50,31,"red","UKRAINE","地政学リスク","top",[0,-14]);
add("conflict",31,35,"red","ISRAEL","中東紛争","right",[14,0]);
add("conflict",32,53,"orange","IRAN","中東緊張","right",[14,0]);
add("conflict",55,37,"red","RUSSIA","制裁・エネルギー","top",[0,-14]);
add("conflict",24,121,"orange","TAIWAN","アジア地政学","top",[0,-14]);

add("oilrate",31,45,"orange","MENA","原油・安全資産","right",[14,0]);
add("oilrate",24,54,"orange","UAE","原油・金フロー","bottom",[0,14]);
add("oilrate",28,77,"yellow","INDIA","金需要","top",[0,-14]);
add("oilrate",-33,151,"orange","AUSTRALIA","資源国","top",[0,-14]);

addSession(35.6,139.7,"アジアセッション","08:00","17:00","right",[18,0]);
addSession(51.5,-0.1,"ロンドンセッション","16:00","01:00","top",[0,-18]);
addSession(40.7,-74,"米国セッション","21:30","06:00","bottom",[0,18]);

const guides=[
["green","アジアセッション","東京時間の開始。円金利・日銀・アジア市場の初動を監視します。OPEN 08:00 / CLOSE 17:00 JST"],
["green","ロンドンセッション","欧州市場の本格開始。出来高が増え、XAUUSDの方向感が出やすい時間帯です。OPEN 16:00 / CLOSE 01:00 JST"],
["green","米国セッション","CPI・NFP・FOMC・米金利でXAUUSDが大きく動きやすい時間帯です。OPEN 21:30 / CLOSE 06:00 JST"],
["red","ウクライナ","戦争リスクが高まると安全資産として金が買われやすくなります。"],
["orange","中東","原油価格と安全資産需要に影響。中東リスクはXAUUSD上昇材料になりやすいです。"],
["blue","FRB","米政策金利・FOMC・FRB発言はXAUUSDに直撃します。"],
["purple","ニューヨーク","米指標とNY市場の出来高が金の値動きを作りやすいです。"],
["yellow","北京","中国金需要・中央銀行買いは金価格の支えになりやすいです。"]
];

function safe(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

document.getElementById("guideBox").innerHTML=guides.map(g=>`
  <button onclick="openModal('${g[0]}','${safe(g[1])}','${safe(g[2])}')"><span class="dot ${g[0]}"></span>${g[1]}　${g[2]}</button>
`).join("");

const monthlyEvents=[
{date:"06/01 23:00",title:"米ISM製造業PMI"},
{date:"06/03 21:15",title:"米ADP雇用統計"},
{date:"06/03 23:00",title:"米ISM非製造業PMI"},
{date:"06/05 21:30",title:"米雇用統計（NFP）"},
{date:"06/10 21:30",title:"米CPI"}
];

document.getElementById("highImpactJP").innerHTML=monthlyEvents.map(e=>`
  <div class="impactItem" onclick="openYoutube('${safe(e.title)} XAUUSD')">
    <span class="impactBadge">高</span>
    <span>${e.date}　${e.title}</span>
    <span class="impactTime">YouTube</span>
  </div>
`).join("");

function openYoutube(keyword){
  window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(keyword),"_blank");
}

function openModal(color,title,text){
  document.getElementById("modalTitle").innerHTML=title;
  document.getElementById("modalText").innerHTML=text;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}

document.getElementById("ticker").textContent="YouTube LIVE / Bloomberg / Kitco / CNBC / XAUUSD GOLD NEWS";
</script>
</body>
</html>
