<style>
:root{
  --bg:#050505;
  --panel:#0b0b0b;
  --panel2:#101010;
  --border:#202020;
  --text:#8a8a8a;
  --muted:#5f5f5f;
  --gold:#b89b5e;
  --green:#00ff88;
  --red:#ff2d2d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  width:100vw;
  height:100vh;
  padding:8px;
  display:grid;
  grid-template-rows:150px 1fr 245px;
  gap:8px;
}

.panel{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  overflow:hidden;
}

.top{
  display:grid;
  grid-template-columns:28% 37% 35%;
  gap:8px;
}

.label{
  font-size:11px;
  color:var(--text);
  letter-spacing:1.3px;
  font-weight:800;
  margin-bottom:6px;
}

.tvBox{
  height:120px;
  overflow:hidden;
}

.clockCal{
  display:grid;
  grid-template-columns:36% 64%;
  gap:10px;
}

.clock{
  font-size:40px;
  font-weight:900;
  color:var(--green);
  line-height:1;
}

.date{
  margin-top:8px;
  font-size:13px;
  color:var(--text);
}

.monthTitle{
  text-align:center;
  font-size:12px;
  font-weight:800;
  color:var(--text);
  margin-bottom:4px;
}

.calGrid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:2px;
}

.calHead,.calDay{
  position:relative;
  text-align:center;
  font-size:10px;
  color:var(--text);
  padding:3px 0;
}

.calHead{color:var(--muted)}

.today{
  background:rgba(255,45,45,.14);
  border-radius:5px;
}

.eventDot::after{
  content:"";
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 8px var(--gold);
  animation:eventBlink 1.2s infinite;
}

@keyframes eventBlink{
  0%{opacity:1}
  50%{opacity:.25}
  100%{opacity:1}
}

.statusGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:6px;
  height:118px;
}

.statusBox{
  border:1px solid #181818;
  border-radius:8px;
  padding:7px;
  background:#080808;
}

.statusTitle{
  font-size:10px;
  color:var(--muted);
  font-weight:800;
}

.statusValue{
  font-size:15px;
  margin-top:5px;
  color:var(--gold);
  font-weight:900;
  white-space:nowrap;
}

.green{color:var(--green)!important}
.red{color:var(--red)!important}

.main{
  display:grid;
  grid-template-columns:52% 48%;
  gap:8px;
  min-height:0;
}

.mapPanel{
  position:relative;
}

.mapTitle{
  position:absolute;
  top:12px;
  left:14px;
  z-index:50;
  color:var(--text);
  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
}

#map{
  position:absolute;
  left:12px;
  right:12px;
  top:42px;
  bottom:12px;
  border:1px solid #171717;
  border-radius:10px;
  overflow:hidden;
  background:#050505;
}

.leaflet-control-attribution,
.leaflet-control-zoom{

.sessionLabel{

.sessionLabel.open{

.sessionTime,

}

.openText{

.videoPanel{

  background:#050505;
}

.videoTools{

  top:8px;
  left:10px;
  right:10px;
  z-index:10;

.videoTools button{

  padding:5px 8px;

.videoTools button.active{

}

.videoFrame{

  height:100%;
  border:0;
  border-radius:10px;

}

.bottom{

  grid-template-columns:52% 48%;
  gap:8px;

}

.newsPanel{

}

.newsTable{

  padding-right:4px;

.newsHead,.newsRow{

  align-items:center;

.newsHead{

.newsRow{

  font-size:12px;
}

.eventCell{

.impactCell{
  color:var(--red);

}

.countCell{

.redCount{

.blink24{

.headlineScroll{

.headlineItem{

.headlineTop{

.headlineTime{

.headlineSource{

.headlineText{

  background:var(--red);

}

@keyframes mapFlash{
  0%{transform:scale(1);opacity:1}
  50%{transform:scale(1.8);opacity:.25}
  100%{transform:scale(1);opacity:1}

@keyframes redPulse{

  100%{opacity:1;text-shadow:0 0 5px var(--red)}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#090909}
::-webkit-scrollbar-thumb{background:#2b2b2b;border-radius:10px}

function getEventDate(e){
  const [y,m,d]=e.date.split("-").map(Number);
  const [hh,mm]=e.time.split(":").map(Number);
  return new Date(y,m-1,d,hh,mm,0,0);
}

function countdown(target){
  const diff=target-new Date();

  if(diff<-3600000)return null;
  if(diff<0)return"ENDED";

  const t=Math.floor(diff/1000);
  const d=Math.floor(t/86400);
  const h=Math.floor((t%86400)/3600);
  const m=Math.floor((t%3600)/60);
  const s=t%60;

  return d>0
    ?`${d}D ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
    :`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function isWithin24h(target){
  const diff=target-new Date();
  return diff>0&&diff<=86400000;
}

function renderHighImpact(){
  const list=document.getElementById("highImpactList");
  list.innerHTML="";

  [...highImpactEvents]
    .map(e=>({...e,target:getEventDate(e)}))
    .sort((a,b)=>a.target-b.target)
    .forEach(e=>{
      const cd=countdown(e.target);
      if(cd===null)return;

      const blink=isWithin24h(e.target)?"blink24":"";

      list.innerHTML+=`
        <div class="newsRow ${blink}">
          <div>${e.date.slice(5)}</div>
          <div>${e.time}</div>
          <div class="eventCell">${e.currency} ${e.event}</div>
          <div class="impactCell">${e.impact}</div>
          <div>${e.forecast}</div>
          <div>${e.previous}</div>
          <div class="countCell ${blink?"redCount":""}">${cd}</div>
        </div>
      `;
    });
}

function renderCalendar(){
  const now=new Date();
  const y=now.getFullYear();
  const m=now.getMonth();
  const grid=document.getElementById("calendarGrid");

  document.getElementById("monthTitle").textContent=`${y} / ${String(m+1).padStart(2,"0")}`;
  grid.innerHTML="";

  const eventDays=new Set(
    highImpactEvents.map(e=>{
      const d=new Date(e.date+"T00:00:00");
      return d.getFullYear()===y&&d.getMonth()===m?d.getDate():null;
    }).filter(Boolean)
  );

  ["SUN","MON","TUE","WED","THU","FRI","SAT"].forEach(h=>{
    grid.innerHTML+=`<div class="calHead">${h}</div>`;
  });

  const first=new Date(y,m,1);
  const last=new Date(y,m+1,0);

  for(let i=0;i<first.getDay();i++){
    grid.innerHTML+=`<div class="calDay"></div>`;
  }

  for(let d=1;d<=last.getDate();d++){
    grid.innerHTML+=`
      <div class="calDay ${d===now.getDate()?"today":""} ${eventDays.has(d)?"eventDot":""}">
        ${d}
      </div>
    `;
  }
}

function updateClock(){
  const now=new Date();

  document.getElementById("clock").textContent=
    now.toLocaleTimeString("ja-JP",{hour12:false});

  document.getElementById("dateText").textContent=
    now.toLocaleDateString("ja-JP",{
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      weekday:"short"
    });

  updateSession(now);
}

function sessionHtml(name,time,isOpen,cd){
  return `

      <span class="sessionTime">${time}</span><br>
      ${isOpen?`<span class="openText">● OPEN</span><br><span class="sessionCountdown">${cd}</span>`:`CLOSED`}

}

function getSessionState(now){
  const h=now.getHours();

  if(h>=7&&h<15)return{open:"ASIA",nextHour:15};
  if(h>=15&&h<21)return{open:"LONDON",nextHour:21};

  return{open:"US",nextHour:7};
}

function updateSession(now){
  const state=getSessionState(now);

  const target=new Date(now);
  target.setHours(state.nextHour,0,0,0);
  if(target<=now)target.setDate(target.getDate()+1);

  const cd=countdown(target);

  document.getElementById("topSession").textContent=state.open;

  if(sessionMarkers.asia){
    sessionMarkers.asia.setIcon(L.divIcon({
      className:"",
      html:sessionHtml("ASIA","07:00-15:00",state.open==="ASIA",cd),
      iconSize:[120,88]
    }));

    sessionMarkers.london.setIcon(L.divIcon({
      className:"",
      html:sessionHtml("LONDON","15:00-21:00",state.open==="LONDON",cd),
      iconSize:[125,88]
    }));

    sessionMarkers.us.setIcon(L.divIcon({
      className:"",
      html:sessionHtml("US","21:00-06:00",state.open==="US",cd),
      iconSize:[120,88]
    }));
  }
}

function initMap(){
  map=L.map("map",{
    zoomControl:false,
    attributionControl:false,
    dragging:false,
    scrollWheelZoom:false,
    doubleClickZoom:false,
    boxZoom:false,
    keyboard:false,
    tap:false
  }).setView([20,10],2);

  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
    maxZoom:5,
    minZoom:2
  }).addTo(map);

  sessionMarkers.us=L.marker([39,-98],{
    icon:L.divIcon({className:"",html:"",iconSize:[120,88]})
  }).addTo(map);

  sessionMarkers.london=L.marker([51,-1],{
    icon:L.divIcon({className:"",html:"",iconSize:[125,88]})
  }).addTo(map);

  sessionMarkers.asia=L.marker([35,120],{
    icon:L.divIcon({className:"",html:"",iconSize:[120,88]})
  }).addTo(map);

  setTimeout(()=>map.invalidateSize(),300);
}

function triggerMapAlert(item){
  const r=regionMap[item.region];
  if(!r||!map)return;

  const point=L.marker([r.lat,r.lng],{
    icon:L.divIcon({
      className:"",
      html:`<div class="flashPoint"></div>`,
      iconSize:[24,24]
    })
  }).addTo(map);

  const popup=L.popup({
    closeButton:false,
    autoClose:false,
    className:""
  })
  .setLatLng([r.lat,r.lng])
  .setContent(`
    <div class="alertPopup">
      <b>BREAKING</b><br>
      ${item.region}<br>
      ${item.text}
    </div>
  `)
  .openOn(map);

  setTimeout(()=>{
    map.removeLayer(point);
    map.closePopup(popup);
  },15000);
}

function renderHeadlines(){
  const now=new Date().toLocaleTimeString("ja-JP",{hour12:false});

  const html=headlines.map(h=>`
    <div class="headlineItem">
      <div class="headlineTop">
        <div class="headlineTime">${h.time||now}</div>
        <div class="headlineSource ${h.breaking?"breaking":""}">${h.source}</div>
        <div class="headlineText">${h.text}</div>
      </div>
    </div>
  `).join("");

  document.getElementById("headlineList").innerHTML=html;
}

async function loadHeadlines(){
  try{
    const res=await fetch("./headlines.json?t="+Date.now(),{cache:"no-store"});

    if(res.ok){
      const data=await res.json();

      if(Array.isArray(data)){
        data.forEach(item=>{
          if(item.breaking&&item.id&&!seenBreakingIds.has(item.id)){
            seenBreakingIds.add(item.id);
            triggerMapAlert(item);
          }
        });

        headlines=data;
      }
    }
  }catch(e){}

  renderHeadlines();
}

initMap();
renderCalendar();
renderHighImpact();
updateClock();
renderHeadlines();

setInterval(updateClock,1000);
setInterval(renderHighImpact,1000);
setInterval(renderCalendar,30000);
setInterval(loadHeadlines,5000);
</script>

</body>
