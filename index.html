<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XAUUSD WAR ROOM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#050505;color:#e8edf2;font-family:Arial,"Meiryo",sans-serif}
a{color:inherit;text-decoration:none}
:root{--red:#ff3030;--orange:#ff8c1a;--yellow:#ffd54f;--blue:#2f8cff;--purple:#9b4dff;--green:#00e676}

.app{height:100vh;display:grid;grid-template-rows:34px 1fr 235px 28px;gap:2px;background:#050505}
.topbar{background:#0b0b0b;border-bottom:1px solid #202020;display:flex;align-items:center;gap:16px;padding:0 10px;font-size:13px}
.brand{color:#00d0aa;font-weight:900;font-size:17px}
.live{color:var(--green);font-weight:900}
.centerTitle{margin:auto;background:#111;border:1px solid #8a5d17;color:#f2b84b;border-radius:5px;padding:5px 70px;font-weight:900}
#topJstTime{color:#fff;font-size:13px;font-weight:800;margin-left:-8px}

.main{display:grid;grid-template-columns:155px 1fr;gap:2px;min-height:0}
.sidebar{background:#0c0c0c;border-right:1px solid #222;padding:7px;overflow:hidden}
.sideTitle{font-size:12px;font-weight:900;margin-bottom:6px}
.check{display:flex;align-items:center;gap:6px;border-bottom:1px solid #202020;padding:6px 0;font-size:11px}
.check input{accent-color:#00c878}

.mapArea{display:grid;grid-template-rows:1fr 235px;gap:2px;min-height:0}
.mapWrap{position:relative;background:#05070b;border:1px solid #202020;overflow:hidden}
#map{width:100%;height:100%;background:#05070b}
.leaflet-container{background:#05070b!important;filter:brightness(1.05) contrast(1.15) saturate(1)}
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom{border:1px solid #333!important}
.leaflet-control-zoom a{background:#0b0b0b!important;color:#fff!important;border-bottom:1px solid #333!important}

.mapTop{position:absolute;top:10px;left:12px;z-index:500;background:#080808d9;border:1px solid #222;border-radius:4px;padding:6px 10px;font-size:12px}
.legend{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:500;background:#090909e6;border:1px solid #222;border-radius:4px;padding:7px 14px;font-size:11px}

.pulse{width:13px;height:13px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor,0 0 30px currentColor,0 0 70px currentColor,0 0 120px currentColor;position:relative}
.pulse:after{content:"";position:absolute;inset:-22px;border:1px solid currentColor;border-radius:50%;animation:ripple 1.6s infinite}
@keyframes ripple{from{transform:scale(.3);opacity:1}to{transform:scale(1.8);opacity:0}}

.sessionPulse{width:14px;height:14px;border-radius:50%;background:#00e676;box-shadow:0 0 15px #00e676,0 0 45px #00e676,0 0 95px #00e676;animation:sessionBlink 1s infinite}
.sessionLabel{background:rgba(0,20,10,.92)!important;color:#00ff88!important;border:1px solid #00ff88!important;border-radius:6px!important;font-size:12px!important;font-weight:900!important;padding:7px 10px!important;box-shadow:0 0 18px rgba(0,255,136,.55)!important;animation:sessionBlink 1s infinite}
@keyframes sessionBlink{0%,100%{opacity:1}50%{opacity:.35}}

.tooltip{background:#080808e8!important;color:#fff!important;border:1px solid #333!important;border-radius:4px!important;font-size:11px!important;padding:7px 9px!important;box-shadow:0 0 15px #000!important}
.leaflet-tooltip:before{display:none!important}

.footerPanels{display:grid;grid-template-columns:1.35fr 1.05fr;gap:2px}
.panel{background:#0d0d0d;border:1px solid #222;padding:8px;overflow:hidden}
.panelTitle{font-size:12px;font-weight:900;color:#fff;margin-bottom:6px}

.impactBox,.guideBox{height:175px;overflow-y:auto;font-size:12px;padding-right:4px}
.impactItem{display:grid;grid-template-columns:36px 1fr 95px;gap:8px;border-bottom:1px solid #242424;padding:7px 0;align-items:center;cursor:pointer}
.impactItem:hover,.item:hover{background:#101820}
.impactBadge{background:#4b1010!important;color:#ff4d4d!important;font-weight:900;text-align:center;border-radius:3px;padding:2px 0}
.impactTime{color:#aaa;text-align:right;font-size:11px}

.guideBox button{width:100%;background:none;border:0;color:#e8edf2;text-align:left;border-bottom:1px solid #242424;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;font-size:12px;padding:3px 0}
.guideBox button:hover{color:#00e676}

.bottom{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:2px}
.item{display:block;border-bottom:1px solid #242424;padding:6px 0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.badge{display:inline-block;padding:1px 5px;border-radius:2px;margin-right:5px;font-weight:900}
.h{background:#4b1010;color:#ff4d4d}.m{background:#3d2706;color:#ffb13b}.l{background:#06263f;color:#49a3ff}
.score{font-size:34px;font-weight:900;color:#00e676;line-height:1}
.scoreText{font-size:12px;color:#aaa;margin-top:4px}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;box-shadow:0 0 10px currentColor}
.dot.green{background:#00e676;color:#00e676}.dot.red{background:#ff3030;color:#ff3030}.dot.orange{background:#ff8c1a;color:#ff8c1a}.dot.blue{background:#2f8cff;color:#2f8cff}.dot.purple{background:#9b4dff;color:#9b4dff}.dot.yellow{background:#ffd54f;color:#ffd54f}

.break{display:flex;align-items:center;overflow:hidden;background:#0a0a0a;border-top:1px solid #222}
.break b{background:#b00000;color:#fff;padding:8px 18px;font-size:12px}
.ticker{white-space:nowrap;animation:flow 240s linear infinite;font-size:12px;padding-left:20px}
@keyframes flow{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:99999}
.modal.show{display:flex}
.modalCard{width:min(650px,90vw);background:#080f18;border:1px solid #00e676;border-radius:10px;padding:20px;box-shadow:0 0 45px rgba(0,255,136,.35)}
.modalCard.green{border-color:#00e676;box-shadow:0 0 45px rgba(0,255,136,.35)}
.modalCard.red{border-color:#ff3030;box-shadow:0 0 45px rgba(255,48,48,.35)}
.modalCard.orange{border-color:#ff8c1a;box-shadow:0 0 45px rgba(255,140,26,.35)}
.modalCard.blue{border-color:#2f8cff;box-shadow:0 0 45px rgba(47,140,255,.35)}
.modalCard.purple{border-color:#9b4dff;box-shadow:0 0 45px rgba(155,77,255,.35)}
.modalCard.yellow{border-color:#ffd54f;box-shadow:0 0 45px rgba(255,213,79,.35)}
.modalTitle{font-size:24px;font-weight:900;margin-bottom:12px;color:#00e676}
.modalTitle.green{color:#00e676}.modalTitle.red{color:#ff3030}.modalTitle.orange{color:#ff8c1a}.modalTitle.blue{color:#2f8cff}.modalTitle.purple{color:#9b4dff}.modalTitle.yellow{color:#ffd54f}
.modalText{font-size:15px;line-height:1.8}
.modalClose{margin-top:16px;background:#101820;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer}
.hiddenPanel{display:none!important}
</style>
</head>

<body>
<div class="app">
  <div class="topbar">
    <div class="brand">🌐 ワールド</div>
    <b>モニター</b>

    <div class="panel"><div class="panelTitle">GEOPOLITICAL LIVE</div><div id="geoLive"></div></div>

  </div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
  <div id="modalCard" class="modalCard" onclick="event.stopPropagation()">
    <div id="modalTitle" class="modalTitle"></div>
    <div id="modalText" class="modalText"></div>
    <button class="modalClose" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
function clock(){
  const now=new Date();
  const jst=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(now);
  const date=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"}).format(now);
  document.getElementById("topJstTime").textContent=date+" "+jst+" JST";
}
setInterval(clock,1000);clock();

const map=L.map("map",{zoomControl:true,attributionControl:false,dragging:true,scrollWheelZoom:true,doubleClickZoom:true,boxZoom:false,keyboard:false}).setView([20,10],2);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19}).addTo(map);

const layers={intelligence:L.layerGroup().addTo(map),conflict:L.layerGroup().addTo(map),economic:L.layerGroup().addTo(map),oilrate:L.layerGroup().addTo(map),session:L.layerGroup().addTo(map)};
const colors={red:"#ff3030",orange:"#ff8c1a",yellow:"#ffd54f",blue:"#2f8cff",purple:"#9b4dff"};

function add(layerName,lat,lng,color,title,body,dir="top",offset=[0,-10]){
  const icon=L.divIcon({className:"",html:`<div class="pulse" style="color:${colors[color]}"></div>`,iconSize:[24,24],iconAnchor:[12,12]});
  const m=L.marker([lat,lng],{icon}).addTo(layers[layerName]);
  m.bindTooltip(`<b>${title}</b><br>${body}`,{permanent:false,direction:dir,offset,className:"tooltip"});
}
function addSession(lat,lng,title,open,close,dir="top",offset=[0,-10]){
  const icon=L.divIcon({className:"",html:`<div class="sessionPulse"></div>`,iconSize:[26,26],iconAnchor:[13,13]});
  const m=L.marker([lat,lng],{icon}).addTo(layers.session);
  m.bindTooltip(`<b>${title}</b><br>OPEN ${open} JST<br>CLOSE ${close} JST`,{permanent:true,direction:dir,offset,className:"sessionLabel"});
}
function toggleLayer(name,state){state?map.addLayer(layers[name]):map.removeLayer(layers[name])}
function toggleIntelligence(state){
  const guidePanel=document.getElementById("guidePanel");
  if(state){
    ["intelligence","session","conflict","economic","oilrate"].forEach(x=>map.addLayer(layers[x]));
    ["conflictToggle","economicToggle","oilToggle"].forEach(id=>document.getElementById(id).checked=true);
    guidePanel.classList.remove("hiddenPanel");
  }else{
    ["intelligence","session","conflict","economic","oilrate"].forEach(x=>map.removeLayer(layers[x]));
    ["conflictToggle","economicToggle","oilToggle"].forEach(id=>document.getElementById(id).checked=false);
    guidePanel.classList.add("hiddenPanel");
  }
}

add("intelligence",40,-74,"purple","ニューヨーク","米国市場 / CPI・NFP・ドル材料","bottom");
add("intelligence",51.5,-0.1,"blue","ロンドン","欧州市場 / 金融市場 / 出来高","top");

add("intelligence",1.3,103.8,"blue","シンガポール","アジア資金フロー / 市場監視","bottom");
add("intelligence",25.2,55.3,"orange","ドバイ","中東資金フロー / ゴールド市場","bottom");
add("intelligence",22.3,114.1,"blue","香港","中国・アジア資金フロー","right");

add("conflict",50,31,"red","ウクライナ","地政学リスク / 戦争リスク","top");
add("conflict",31,35,"red","イスラエル","中東紛争 / 安全資産買い","right");
add("conflict",32,53,"orange","イラン","中東緊張 / 原油リスク","right");
add("conflict",55,37,"red","ロシア","制裁・エネルギー・地政学リスク","top");
add("conflict",24,121,"orange","台湾","アジア地政学リスク","top");

add("economic",39,-77,"blue","ワシントンDC","FRB / 金融政策 / 金利材料","right");
add("economic",39,116,"yellow","北京","中国経済 / 金需要 / 中央銀行買い","left");
add("economic",48,14,"blue","EU","ECB / 欧州金利 / 経済指標","bottom");

add("oilrate",31,45,"orange","中東","地政学リスク / 原油・安全資産","right");
add("oilrate",24,54,"orange","UAE","原油・金フロー / 中東市場","bottom");
add("oilrate",28,77,"yellow","インド","金需要 / 実需買い","top");
add("oilrate",-33,151,"orange","オーストラリア","資源国 / コモディティ材料","top");
add("oilrate",-23,-46,"orange","ブラジル","資源国 / コモディティフロー","top");

addSession(35.6,139.7,"アジアセッション","08:00","17:00","right",[20,0]);
addSession(51.5,-0.1,"ロンドンセッション","16:00","01:00","top",[0,-18]);
addSession(40.7,-74,"米国セッション","21:30","06:00","bottom",[0,20]);

const monthlyEvents=[
{date:"2026-06-01T23:00:00+09:00",title:"米ISM製造業PMI",detail:"米製造業の景況感。強い結果はドル高・金利上昇でXAUUSD下落圧力。弱い結果はドル安・金買い材料。"},
{date:"2026-06-03T21:15:00+09:00",title:"米ADP雇用統計",detail:"民間雇用の先行指標。強い結果はNFP前のドル買い材料。弱い結果はドル売り・金買い材料。"},
{date:"2026-06-03T23:00:00+09:00",title:"米ISM非製造業PMI",detail:"米サービス業の景況感。強い結果はドル高・金利上昇でXAUUSD下落圧力。弱い結果はドル安・金買い材料。"},
{date:"2026-06-05T21:30:00+09:00",title:"米雇用統計（NFP）",detail:"雇用者数・失業率・平均時給。強い雇用はXAUUSD下落圧力。弱い雇用はXAUUSD上昇材料。"},
{date:"2026-06-10T21:30:00+09:00",title:"米CPI",detail:"インフレ最重要指標。上振れはドル高・金利上昇でXAUUSD下落圧力。下振れは上昇材料。"},
{date:"2026-06-11T21:30:00+09:00",title:"米PPI",detail:"企業側インフレ。上振れはCPI警戒でXAUUSD下落圧力。"},
{date:"2026-06-18T03:00:00+09:00",title:"FOMC政策金利",detail:"タカ派ならXAUUSD下落圧力。ハト派なら上昇材料。"},
{date:"2026-06-18T03:30:00+09:00",title:"FRB議長会見",detail:"FOMC後の方向感を決める会見。利下げ前向きなら金に上昇圧力。"},
{date:"2026-06-25T21:30:00+09:00",title:"米PCEデフレーター",detail:"FRBが重視するインフレ指標。上振れは下落圧力、下振れは上昇材料。"}
];

function fmtEventDate(iso){return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso))}
function fmtCountdown(iso){const diff=new Date(iso)-new Date();if(diff<=0)return"終了";const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000);return d>0?`あと ${d}日 ${h}時間`:h>0?`あと ${h}時間 ${m}分`:`あと ${m}分`}
function renderMonthlyImpact(){
 const events=monthlyEvents.sort((a,b)=>new Date(a.date)-new Date(b.date));
 document.getElementById("highImpactJP").innerHTML=events.map((e,i)=>`<div class="impactItem" onclick="showImpact(${i})"><span class="impactBadge">高</span><span>${fmtEventDate(e.date)}　${e.title}</span><span class="impactTime">${fmtCountdown(e.date)}</span></div>`).join("");
}
function showImpact(i){
 const e=monthlyEvents.sort((a,b)=>new Date(a.date)-new Date(b.date))[i];
 openModal("red",e.title,`<b>発表日時</b><br>${fmtEventDate(e.date)} JST<br><br><b>XAUUSDへの見方</b><br>${e.detail}`);
}
renderMonthlyImpact();setInterval(renderMonthlyImpact,60000);

const guides=[
["green","アジアセッション","東京時間の開始。円金利・日銀・アジア市場の初動を監視します。OPEN 08:00 / CLOSE 17:00 JST"],
["green","ロンドンセッション","欧州市場の本格開始。出来高が増え、XAUUSDの方向感が出やすい時間帯です。OPEN 16:00 / CLOSE 01:00 JST"],
["green","米国セッション","CPI・NFP・FOMC・米金利でXAUUSDが大きく動きやすい時間帯です。OPEN 21:30 / CLOSE 06:00 JST"],
["red","ウクライナ","戦争リスクが高まると安全資産として金が買われやすくなります。"],
["orange","中東","原油価格と安全資産需要に影響。中東リスクはXAUUSD上昇材料になりやすいです。"],
["blue","ワシントンDC","FRB・金利材料。政策金利、FOMC、FRB発言はXAUUSDに直撃します。"],

["yellow","北京","中国金需要・中央銀行買いは金価格の支えになりやすいです。"]
];
document.getElementById("guideBox").innerHTML=guides.map((g,i)=>`<button onclick="openGuide(${i})"><span class="dot ${g[0]}"></span>${g[1]}　${g[2]}</button>`).join("");
function openGuide(i){openModal(guides[i][0],guides[i][1],guides[i][2])}

function renderItems(id,items,color){
 document.getElementById(id).innerHTML=items.map((x,i)=>`<div class="item" onclick="openModal('${color}','${x.title}','${x.detail}')"><span class="badge ${i<2?'h':'m'}">${i<2?'高':'中'}</span>${x.title}</div>`).join("");
}

function loadBottomLive(){
 renderItems("geoLive",[
  {title:"ウクライナ情勢　地政学リスク継続",detail:"安全資産買いが入りやすく、XAUUSDは上昇圧力を受けやすいです。"},
  {title:"中東リスク　原油・金に影響",detail:"中東緊張は原油高と金買いにつながりやすいです。"},

  {title:"ロシア制裁　エネルギー市場に影響",detail:"制裁・原油・ガス価格はインフレ経由で金に影響します。"}
 ],"red");

 renderItems("bankLive",[
  {title:"FRB発言　金利見通しに注目",detail:"タカ派ならドル高・XAUUSD下落。ハト派なら金買い材料です。"},
  {title:"FOMC　政策金利イベント警戒",detail:"利下げ期待が強まるとXAUUSDは上昇しやすいです。"},
  {title:"ECB　欧州金利材料",detail:"欧州金利はドル相対にも影響し、XAUUSDに波及します。"},
  {title:"BOJ　円金利・アジア時間に影響",detail:"東京時間の金利変動は短期の値動きに影響します。"}
