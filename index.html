<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XAUUSD WORLD MONITOR</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#080808;color:#ddd;font-family:Arial,"Meiryo",sans-serif}
a{color:inherit;text-decoration:none}
:root{--line:#222;--panel:#111;--green:#00e676;--red:#ff3b30;--orange:#ff8c1a;--yellow:#ffd54f;--blue:#3d8bff}

.app{height:100vh;display:grid;grid-template-rows:34px 1fr 250px;gap:2px;background:#050505}
.topbar{height:34px;background:#0b0b0b;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;gap:18px;padding:0 10px;font-size:13px}
.brand{color:#00d0aa;font-weight:900;font-size:17px}
.centerTitle{margin:auto;background:#111;border:1px solid #8a5d17;color:#f2b84b;border-radius:5px;padding:5px 60px;font-weight:900}
.live{color:var(--green)}
.time{color:#fff}

.main{display:grid;grid-template-columns:155px 1fr;gap:2px;min-height:0}
.sidebar{background:#0c0c0c;border-right:1px solid #222;padding:7px;overflow:hidden}
.sideTitle{font-size:12px;font-weight:900;color:#fff;margin:5px 0}
.check{display:flex;align-items:center;gap:6px;border-bottom:1px solid #202020;padding:6px 0;font-size:11px}
.check input{accent-color:#00c878}

.mapArea{display:grid;grid-template-rows:1fr 250px;gap:2px;min-height:0}
.mapWrap{position:relative;background:#090909;border:1px solid #202020}
#map{width:100%;height:100%;background:#080808}
.leaflet-container{background:#080808!important;filter:brightness(.62) contrast(1.25) saturate(.8)}
.leaflet-control-attribution,.leaflet-control-zoom{display:none!important}

.mapTop{position:absolute;top:10px;left:12px;z-index:500;background:#080808d9;border:1px solid #222;border-radius:4px;padding:6px 10px;font-size:12px}
.mapClock{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:500;background:#090909d9;border:1px solid #222;border-radius:4px;padding:5px 16px;font-size:12px}
.legend{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:500;background:#090909e6;border:1px solid #222;border-radius:4px;padding:7px 14px;font-size:11px}

.pulse{width:12px;height:12px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor,0 0 30px currentColor,0 0 70px currentColor;position:relative}
.pulse:after{content:"";position:absolute;inset:-20px;border:1px solid currentColor;border-radius:50%;animation:ripple 1.6s infinite}
@keyframes ripple{from{transform:scale(.3);opacity:1}to{transform:scale(1.8);opacity:0}}

.tooltip{background:#080808e8!important;color:#fff!important;border:1px solid #333!important;border-radius:4px!important;font-size:11px!important;padding:7px 9px!important;box-shadow:0 0 15px #000!important}
.leaflet-tooltip:before{display:none!important}

.bottom{display:grid;grid-template-columns:1.05fr 1fr 1fr 1fr 1fr;gap:2px;background:#050505}
.panel{background:#0d0d0d;border:1px solid #222;padding:8px;overflow:hidden}
.panelTitle{font-size:12px;font-weight:900;color:#fff;margin-bottom:8px;display:flex;justify-content:space-between}
.item{display:block;border-bottom:1px solid #242424;padding:6px 0;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:1px 5px;border-radius:2px;margin-right:5px;font-weight:900}
.h{background:#4b1010;color:#ff4d4d}.m{background:#3d2706;color:#ffb13b}.l{background:#06263f;color:#49a3ff}

.footerPanels{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px}
.videoBox{background:#0b0b0b;border:1px solid #222;padding:8px}
.videoThumb{height:145px;background:linear-gradient(135deg,#162635,#050505);border:1px solid #333;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff}
.break{position:absolute;bottom:0;left:0;right:0;height:28px;background:#0a0a0a;border-top:1px solid #222;display:flex;align-items:center;overflow:hidden}
.break b{background:#b00000;color:#fff;padding:8px 18px;font-size:12px}
.ticker{white-space:nowrap;animation:flow 180s linear infinite;font-size:12px;padding-left:20px}
@keyframes flow{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
</style>
</head>

<body>
<div class="app">

  <div class="topbar">
    <div class="brand">🌐 ワールド</div>
    <b>モニター</b>
    <span>v2.1.4</span>
    <span class="live">● ライブ</span>
    <span>グローバル</span>
    <div class="centerTitle">XAUUSD WAR ROOM</div>
    <span>更新中 <span id="jstTop">--:--:--</span> JST</span>
    <span class="live">● 自動更新</span>
  </div>

  <div class="main">
    <div class="sidebar">
      <div class="sideTitle">世界情報</div>
      <label class="check"><input type="checkbox" checked> インテリジェントスポット</label>
      <label class="check"><input type="checkbox" checked> 紛争地域</label>
      <label class="check"><input type="checkbox" checked> 重要指標</label>
      <label class="check"><input type="checkbox" checked> 原油・金利</label>
      <label class="check"><input type="checkbox"> 為替・通貨</label>
      <label class="check"><input type="checkbox"> 供給網</label>
      <label class="check"><input type="checkbox"> AIデータセンター</label>
      <label class="check"><input type="checkbox" checked> 事件速報</label>
      <label class="check"><input type="checkbox"> 貿易政策</label>
      <label class="check"><input type="checkbox"> フライト遅延</label>
      <label class="check"><input type="checkbox"> 核関連</label>
    </div>

    <div class="mapArea">
      <div class="mapWrap">
        <div id="map"></div>
        <div class="mapTop">すべて</div>
        <div class="mapClock" id="mapClock">--:--:-- UTC</div>
        <div class="legend">
          <span style="color:#ff3b30">● 高インパクト</span>　
          <span style="color:#ff8c1a">● 地政学</span>　
          <span style="color:#ffd54f">● 経済</span>　
          <span style="color:#3d8bff">● 金融</span>　
          <span style="color:#9b4dff">● 市場</span>
        </div>
      </div>

      <div class="footerPanels">
        <div class="videoBox">
          <div class="panelTitle">ライブニュース <span class="live">● ライブ</span></div>
          <a target="_blank" href="https://www.youtube.com/@BloombergTV/live"><div class="videoThumb">Bloomberg TV Live</div></a>
        </div>
        <div class="panel"><div class="panelTitle">AIインサイト</div><div id="aiNews"></div></div>
        <div class="panel"><div class="panelTitle">AI検知脅威</div><div id="riskNews"></div></div>
        <div class="panel"><div class="panelTitle">国別不安定指数</div><div id="hotNews"></div></div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="panel"><div class="panelTitle">中東 / MENA</div><div id="mena"></div></div>
    <div class="panel"><div class="panelTitle">アフリカ</div><div id="africa"></div></div>
    <div class="panel"><div class="panelTitle">中南米</div><div id="latam"></div></div>
    <div class="panel"><div class="panelTitle">アジア太平洋</div><div id="asia"></div></div>
    <div class="panel"><div class="panelTitle">エネルギー・資源</div><div id="energy"></div></div>
  </div>

  <div class="break">
    <b>BREAKING NEWS</b>
    <div id="ticker" class="ticker">RSS読み込み中...</div>
  </div>

</div>

<script>
function clock(){
  const jst=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date());
  const utc=new Intl.DateTimeFormat("en-GB",{timeZone:"UTC",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(new Date());
  document.getElementById("jstTop").textContent=jst;
  document.getElementById("mapClock").textContent=utc+" UTC";
}
setInterval(clock,1000);clock();

const map=L.map("map",{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false}).setView([20,10],2);

L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19}).addTo(map);

const c={red:"#ff3b30",orange:"#ff8c1a",yellow:"#ffd54f",blue:"#3d8bff",purple:"#9b4dff"};

function add(lat,lng,color,title,body,dir="top",offset=[0,-10]){
  const icon=L.divIcon({className:"",html:`<div class="pulse" style="color:${c[color]}"></div>`,iconSize:[24,24],iconAnchor:[12,12]});
  const m=L.marker([lat,lng],{icon}).addTo(map);
  m.bindTooltip(`<b>${title}</b><br>${body}`,{permanent:false,direction:dir,offset,className:"tooltip"});
  m.on("click",()=>window.open("https://news.google.com/search?q="+encodeURIComponent(title+" gold XAUUSD"),"_blank"));
}

add(50,31,"red","Ukraine Conflict","Conflict Zone","top");
add(31,45,"orange","Middle East","Geopolitical Risk","right");
add(39,-77,"blue","Washington DC","FRB / Policy","right");
add(40,-74,"purple","New York","Market / CPI / NFP","bottom");
add(51.5,-0.1,"blue","London","Financial Market","top");
add(35.6,139.7,"purple","Tokyo","Market / Gold","left");
add(39,116,"yellow","Beijing","China Demand","left");
add(1.3,103.8,"blue","Singapore","Asia Flow","bottom");
add(-33,151,"orange","Australia","Resources","top");
add(31,35,"red","Israel","Conflict Watch","right");
add(24,54,"orange","UAE","Oil / Gold Flow","bottom");
add(28,77,"yellow","India","Gold Demand","top");
add(-23,-46,"orange","Brazil","Commodity Flow","top");
add(19,-99,"orange","Mexico","Trade / USD","bottom");
add(48,14,"blue","EU","ECB / Rates","bottom");
add(55,37,"red","Russia","Sanctions / Energy","top");

const fallback=[
 ["高","ウクライナ情勢、ロシアの攻撃激化で避難指示拡大","https://news.google.com/search?q=Ukraine+war+gold"],
 ["高","米CPIが予想以上に上昇、金価格に影響","https://news.google.com/search?q=US+CPI+gold"],
 ["中","中東情勢の緊迫化で安全資産としての金需要が高まる","https://news.google.com/search?q=Middle+East+gold"],
 ["中","FRB高官、利下げ判断はデータ次第と発言","https://news.google.com/search?q=FRB+gold"],
 ["低","世界の金ETF、前日比で資金流入","https://news.google.com/search?q=gold+ETF+inflows"]
];

function render(id,items=fallback){
  document.getElementById(id).innerHTML=items.map(x=>`<a class="item" target="_blank" href="${x[2]}"><span class="badge ${x[0]=="高"?"h":x[0]=="中"?"m":"l"}">${x[0]}</span>${x[1]}</a>`).join("");
}

["aiNews","riskNews","hotNews","mena","africa","latam","asia","energy"].forEach(id=>render(id));

async function loadNews(){
  try{
    const q="XAUUSD gold geopolitical risk Federal Reserve CPI";
    const url="https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent("https://news.google.com/rss/search?q="+encodeURIComponent(q)+"&hl=ja&gl=JP&ceid=JP:ja");
    const j=await (await fetch(url)).json();
    const items=(j.items||[]).slice(0,8).map((it,i)=>[i<2?"高":i<5?"中":"低",it.title.replace(/ - .*/,""),it.link]);
    if(items.length){
      render("aiNews",items.slice(0,4));
      render("riskNews",items.slice(1,5));
      render("hotNews",items.slice(2,6));
      render("mena",items.slice(0,4));
      render("africa",items.slice(1,5));
      render("latam",items.slice(2,6));
      render("asia",items.slice(3,7));
      render("energy",items.slice(4,8));
      document.getElementById("ticker").textContent=items.map(x=>x[1]).join("　｜　");
    }
  }catch(e){
    document.getElementById("ticker").textContent=fallback.map(x=>x[1]).join("　｜　");
  }
}
loadNews();
setInterval(loadNews,60000);
</script>
</body>
</html>
